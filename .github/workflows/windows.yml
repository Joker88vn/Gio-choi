name: Build COD Master for Windows

on:
  push:
    branches: [audio-master]
    paths:
      - 'desktop/**'
      - 'app/src/main/java/vn/daopham/codmaster/dsp/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.2.0

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tải ffmpeg (giải mã + MP3) và FlatLaf
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\input | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $exe = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName build\input\ffmpeg.exe
          Get-ChildItem ff -Recurse -Filter LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination build\input\FFMPEG-LICENSE.txt
          Invoke-WebRequest https://repo1.maven.org/maven2/com/formdev/flatlaf/3.5.4/flatlaf-3.5.4.jar -OutFile build\input\flatlaf.jar
          & build\input\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Biên dịch
        shell: bash
        run: |
          mkdir -p build/classes
          javac -encoding UTF-8 --release 21 -d build/classes \
            app/src/main/java/vn/daopham/codmaster/dsp/*.java \
            $(find desktop/src -name '*.java')
          printf 'Main-Class: vn.daopham.codmaster.desktop.Main\nClass-Path: flatlaf.jar\n' > build/manifest.txt
          jar --create --file build/input/codmaster.jar --manifest build/manifest.txt -C build/classes .

      - name: Kiểm tra WiX
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory | Select-Object -First 1
            if ($wix) { "$($wix.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
            else { choco install wixtoolset -y --no-progress; "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
          }

      - name: Đóng gói (bộ cài .exe + bản chạy không cần cài)
        shell: pwsh
        run: |
          $common = @(
            '--name', 'COD Master',
            '--app-version', $env:APP_VERSION,
            '--vendor', 'COD',
            '--description', 'COD Master - Master am thanh chat luong cao',
            '--input', 'build\input',
            '--main-jar', 'codmaster.jar',
            '--main-class', 'vn.daopham.codmaster.desktop.Main',
            '--icon', 'desktop\icon.ico',
            '--java-options', '-XX:MaxRAMPercentage=60',
            '--java-options', '-Dfile.encoding=UTF-8',
            '--java-options', '-Dsun.java2d.d3d=true'
          )
          $win = @('--win-dir-chooser', '--win-shortcut', '--win-shortcut-prompt', '--win-menu',
                   '--win-menu-group', 'COD Master', '--win-per-user-install',
                   '--win-upgrade-uuid', '4bcd157a-3cd1-4010-90c1-b601bceb305b')
          jpackage --type exe @common @win --dest dist
          jpackage --type app-image @common --dest portable
          Compress-Archive -Path 'portable\COD Master' -DestinationPath "dist\CODMaster-Portable-$env:APP_VERSION.zip"
          Get-ChildItem dist\*.exe | Rename-Item -NewName "CODMaster-Setup-$env:APP_VERSION.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: codmaster-win-${{ github.run_number }}
          name: COD Master cho Windows – bản ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            **CODMaster-Setup-*.exe** – bộ cài (không cần quyền admin, tạo lối tắt ngoài Desktop + Start Menu).
            **CODMaster-Portable-*.zip** – giải nén là chạy, không cần cài.
          files: |
            dist/*.exe
            dist/*.zip
