name: Build COD Master for Windows

on:
  push:
    branches: [audio-master]
    paths:
      - 'desktop/**'
      - 'app/src/main/java/vn/daopham/codmaster/dsp/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.3.0

jobs:
  ffmpeg:
    # ffmpeg rút gọn: chỉ giải mã âm thanh + mã hoá MP3 (LAME), liên kết tĩnh — nhẹ ~3 MB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: out/ffmpeg.exe
          key: ffmpeg-audio-7.1-lame3.100-v2
      - name: Công cụ biên dịch chéo
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm make pkg-config
      - name: Build LAME
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 -o lame.tgz https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          tar xzf lame.tgz && cd lame-3.100
          sed -i '/lame_init_old/d' include/libmp3lame.sym
          ./configure --host=x86_64-w64-mingw32 --prefix=/opt/lame --disable-shared --enable-static \
            --disable-frontend --disable-decoder --disable-gtktest
          make -j4 && sudo make install
      - name: Build ffmpeg (chỉ âm thanh)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 -o ff.txz https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
          tar xJf ff.txz && cd ffmpeg-7.1
          ./configure --target-os=mingw32 --arch=x86_64 --cross-prefix=x86_64-w64-mingw32- \
            --pkg-config=pkg-config --pkg-config-flags=--static \
            --disable-everything --disable-autodetect --disable-network --disable-doc \
            --disable-ffplay --disable-ffprobe --disable-avdevice --disable-swscale --disable-postproc \
            --enable-avfilter --enable-swresample --enable-w32threads \
            --disable-debug --enable-stripping \
            --enable-protocol=file,pipe \
            --enable-demuxer=mp3,wav,w64,flac,aac,mov,ogg,aiff,asf,matroska,caf,pcm_f32le,ape,tta,wv \
            --enable-decoder=mp3,mp3float,aac,aac_fixed,aac_latm,flac,vorbis,opus,alac,wmav1,wmav2,wmapro,ape,tta,wavpack \
            --enable-decoder=pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,pcm_f64le,pcm_s16be,pcm_s24be,pcm_s32be,pcm_f32be,pcm_u8,pcm_alaw,pcm_mulaw \
            --enable-parser=mpegaudio,aac,aac_latm,flac,vorbis,opus \
            --enable-muxer=pcm_f32le,mp3 --enable-encoder=pcm_f32le,libmp3lame --enable-libmp3lame \
            --enable-filter=abuffer,abuffersink,aformat,anull,aresample,atrim,asetpts \
            --extra-cflags=-I/opt/lame/include --extra-ldflags="-L/opt/lame/lib -static" \
            --extra-libs="-lmp3lame"
          make -j4
          mkdir -p ../out && cp ffmpeg.exe ../out/ffmpeg.exe
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-audio
          path: out/ffmpeg.exe

  windows:
    needs: ffmpeg
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-audio
          path: build/input

      - name: Tải FlatLaf + kiểm tra ffmpeg (giải mã/mã hoá MP3)
        shell: pwsh
        run: |
          Invoke-WebRequest https://repo1.maven.org/maven2/com/formdev/flatlaf/3.5.4/flatlaf-3.5.4.jar -OutFile build\input\flatlaf.jar
          $ff = "build\input\ffmpeg.exe"
          "{0:N1} MB" -f ((Get-Item $ff).Length / 1MB)
          $ErrorActionPreference = 'Continue'
          [IO.File]::WriteAllBytes("$pwd\z.raw", [byte[]]::new(44100 * 8 * 2))
          $o1 = & $ff -hide_banner -y -f f32le -ar 44100 -ac 2 -i z.raw -c:a libmp3lame -b:a 320k t.mp3 2>&1 | Out-String
          $o2 = & $ff -hide_banner -y -i t.mp3 -vn -ac 2 -acodec pcm_f32le -f f32le t.raw 2>&1 | Out-String
          $n = if (Test-Path t.raw) { (Get-Item t.raw).Length } else { 0 }
          "decoded bytes: $n"
          if ($n -lt 600000) {
            foreach ($l in ($o1 + "`n----`n" + $o2) -split "`r?`n") { if ($l.Trim()) { Write-Output "::error::$l" } }
            exit 1
          }

      - name: Biên dịch
        shell: bash
        run: |
          mkdir -p build/classes
          javac -encoding UTF-8 --release 21 -d build/classes \
            app/src/main/java/vn/daopham/codmaster/dsp/*.java \
            $(find desktop/src -name '*.java')
          printf 'Main-Class: vn.daopham.codmaster.desktop.Main\nClass-Path: flatlaf.jar\n' > build/manifest.txt
          jar --create --file build/input/codmaster.jar --manifest build/manifest.txt -C build/classes .

      - name: Kiểm tra WiX
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory | Select-Object -First 1
            if ($wix) { "$($wix.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
            else { choco install wixtoolset -y --no-progress; "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
          }

      - name: Đóng gói (bộ cài .exe + bản chạy không cần cài)
        shell: pwsh
        run: |
          $common = @(
            '--name', 'COD Master',
            '--app-version', $env:APP_VERSION,
            '--vendor', 'COD',
            '--description', 'COD Master - Master am thanh chat luong cao',
            '--input', 'build\input',
            '--main-jar', 'codmaster.jar',
            '--main-class', 'vn.daopham.codmaster.desktop.Main',
            '--icon', 'desktop\icon.ico',
            '--java-options', '-XX:MaxRAMPercentage=60',
            '--java-options', '-Dfile.encoding=UTF-8',
            '--java-options', '-Dsun.java2d.d3d=true',
            '--add-modules', 'java.desktop,java.prefs,java.logging,jdk.unsupported',
            '--jlink-options', '--strip-debug --no-man-pages --no-header-files --compress=zip-0'
          )
          $win = @('--win-dir-chooser', '--win-shortcut', '--win-shortcut-prompt', '--win-menu',
                   '--win-menu-group', 'COD Master', '--win-per-user-install',
                   '--win-upgrade-uuid', '4bcd157a-3cd1-4010-90c1-b601bceb305b')
          jpackage --type exe @common @win --dest dist
          jpackage --type app-image @common --dest portable
          Compress-Archive -Path 'portable\COD Master' -DestinationPath "dist\CODMaster-Portable-$env:APP_VERSION.zip"
          Get-ChildItem dist\*.exe | Rename-Item -NewName "CODMaster-Setup-$env:APP_VERSION.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: codmaster-win-${{ github.run_number }}
          name: COD Master cho Windows – bản ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            **CODMaster-Setup-*.exe** – bộ cài (không cần quyền admin, tạo lối tắt ngoài Desktop + Start Menu).
            **CODMaster-Portable-*.zip** – giải nén là chạy, không cần cài.
          files: |
            dist/*.exe
            dist/*.zip
