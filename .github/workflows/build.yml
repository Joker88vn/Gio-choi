name: Build COD Master APK

on:
  push:
    branches: [audio-master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon > build.log 2>&1
          code=$?
          set -e
          tail -30 build.log
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi
          cp app/build/outputs/apk/release/app-release.apk /tmp/CODMaster.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: codmaster-${{ github.run_number }}
          name: COD Master – bản ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: /tmp/CODMaster.apk
      - name: Publish APK to apk-codmaster branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan apk-codmaster
          git rm -rf --quiet .
          cp /tmp/CODMaster.apk .
          git add CODMaster.apk
          git commit -m "COD Master APK build ${{ github.run_number }}"
          git push -f origin apk-codmaster
